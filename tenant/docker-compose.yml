services:
  # ── Main App ──────────────────────────────────
  rag-chatbot:
    build: .
    ports:
      - "1223:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./public/logos:/app/public/logos
      - ./public/embed/logos:/app/public/embed/logos
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ── MongoDB Local ─────────────────────────────
  mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant Vector DB ──────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── MySQL (External Data / Text-to-SQL) ───────
  mysql:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-genia_mysql_2024}
      - MYSQL_DATABASE=genia_data
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
  qdrant_data:
  mysql_data:
