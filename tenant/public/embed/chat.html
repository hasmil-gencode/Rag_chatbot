<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent!important}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body.config-bridge #gbc-toggle,body.config-bridge #gbc-window{display:none!important}
body.host-window #gbc-toggle{display:none}
body.host-window #gbc-window{display:flex;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;bottom:auto;right:auto;border-radius:0!important;box-shadow:none}

#gbc-toggle{position:fixed;bottom:0;right:0;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .2s;z-index:10;overflow:hidden}
#gbc-toggle:hover{transform:scale(1.08)}
#gbc-toggle img{width:100%;height:100%;object-fit:cover}
#gbc-toggle svg{width:24px;height:24px;fill:#fff}

#gbc-window{position:fixed;bottom:76px;right:0;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 100px);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);display:none;flex-direction:column;overflow:hidden;z-index:10}
#gbc-window.open{display:flex}

.theme-light #gbc-window{background:#fff}
body.theme-light.host-window{background:#fff!important}
.theme-light #gbc-login h3{color:#1e293b}
.theme-light #gbc-login p{color:#64748b}
.theme-light #gbc-login input{border:1px solid #e2e8f0;background:#fff;color:#1e293b}
.theme-light #gbc-login input::placeholder{color:#94a3b8}
.theme-light .gbc-msg.bot,.theme-light .gbc-msg.welcome{background:#f1f5f9;color:#1e293b}
.theme-light #gbc-input-area{border-top:1px solid #f1f5f9}
.theme-light #gbc-input{border:1px solid #e2e8f0;background:#fff;color:#1e293b}
.theme-light #gbc-input::placeholder{color:#94a3b8}
.theme-light #gbc-powered{color:#94a3b8}
.theme-light #gbc-powered a{color:#64748b}
.theme-light #gbc-login-error{color:#ef4444}
.theme-light #gbc-messages::-webkit-scrollbar-thumb{background:#cbd5e1}

.theme-dark #gbc-window{background:#1e1e2e}
body.theme-dark.host-window{background:#1e1e2e!important}
.theme-dark #gbc-login h3{color:#e2e8f0}
.theme-dark #gbc-login p{color:#94a3b8}
.theme-dark #gbc-login input{border:1px solid #374151;background:#2a2a3e;color:#e2e8f0}
.theme-dark #gbc-login input::placeholder{color:#6b7280}
.theme-dark .gbc-msg.bot,.theme-dark .gbc-msg.welcome{background:#2a2a3e;color:#e2e8f0}
.theme-dark #gbc-input-area{border-top:1px solid #374151}
.theme-dark #gbc-input{border:1px solid #374151;background:#2a2a3e;color:#e2e8f0}
.theme-dark #gbc-input::placeholder{color:#6b7280}
.theme-dark #gbc-powered{color:#6b7280}
.theme-dark #gbc-powered a{color:#94a3b8}
.theme-dark #gbc-login-error{color:#f87171}
.theme-dark #gbc-messages::-webkit-scrollbar-thumb{background:#4b5563}
.theme-dark .gbc-typing span{background:#6b7280}
.theme-dark #gbc-user-menu{background:#2a2a3e;border:1px solid #374151}
.theme-dark #gbc-user-menu-name{color:#94a3b8;border-color:#374151}
.theme-dark #gbc-user-menu button:hover{background:#3b1c1c}

@media(prefers-color-scheme:dark){
.theme-auto #gbc-window{background:#1e1e2e}
body.theme-auto.host-window{background:#1e1e2e!important}
.theme-auto #gbc-login h3{color:#e2e8f0}
.theme-auto #gbc-login p{color:#94a3b8}
.theme-auto #gbc-login input{border:1px solid #374151;background:#2a2a3e;color:#e2e8f0}
.theme-auto .gbc-msg.bot,.theme-auto .gbc-msg.welcome{background:#2a2a3e;color:#e2e8f0}
.theme-auto #gbc-input-area{border-top:1px solid #374151}
.theme-auto #gbc-input{border:1px solid #374151;background:#2a2a3e;color:#e2e8f0}
.theme-auto #gbc-powered{color:#6b7280}
.theme-auto #gbc-powered a{color:#94a3b8}
.theme-auto .gbc-typing span{background:#6b7280}
}

#gbc-header{padding:12px 16px;display:flex;align-items:center;gap:10px;color:#fff;flex-shrink:0}
#gbc-header-logo{width:30px;height:30px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.2);flex-shrink:0}
#gbc-header-info{flex:1;min-width:0}
#gbc-header-title{font-size:14px;font-weight:600}
#gbc-header-subtitle{font-size:11px;opacity:.8;margin-top:1px}
#gbc-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#gbc-user-avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:none;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;cursor:pointer;position:relative;flex-shrink:0}
#gbc-user-menu{position:absolute;top:32px;right:0;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:4px;display:none;min-width:120px;z-index:20}
#gbc-user-menu.show{display:block}
#gbc-user-menu-name{padding:6px 10px;font-size:11px;color:#64748b;border-bottom:1px solid #f1f5f9}
#gbc-user-menu button{width:100%;text-align:left;padding:6px 10px;font-size:12px;background:none;border:none;cursor:pointer;color:#ef4444;border-radius:4px}
#gbc-user-menu button:hover{background:#fef2f2}
#gbc-close{background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;padding:4px;flex-shrink:0}
#gbc-close:hover{color:#fff}

#gbc-login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
#gbc-login h3{font-size:18px;font-weight:600;margin-bottom:4px}
#gbc-login p{font-size:13px;margin-bottom:20px}
#gbc-login input{width:100%;height:42px;padding:0 14px;border-radius:10px;font-size:13px;outline:none;margin-bottom:10px}
#gbc-login button{width:100%;height:42px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
#gbc-login button:disabled{opacity:.6;cursor:not-allowed}
#gbc-login-error{font-size:12px;margin-bottom:8px;display:none}

#gbc-chat{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
#gbc-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
#gbc-messages::-webkit-scrollbar{width:4px}

.gbc-msg{max-width:82%;padding:10px 14px;line-height:1.5;word-wrap:break-word}
.gbc-msg.user{align-self:flex-end;color:#fff;white-space:pre-wrap}
.gbc-msg.bot,.gbc-msg.welcome{align-self:flex-start;white-space:normal}
.gbc-msg.welcome{font-style:italic}

.bubble-modern .gbc-msg{border-radius:18px}
.bubble-modern .gbc-msg.user{border-bottom-right-radius:4px}
.bubble-modern .gbc-msg.bot,.bubble-modern .gbc-msg.welcome{border-bottom-left-radius:4px}
.bubble-rounded .gbc-msg{border-radius:12px}
.bubble-sharp .gbc-msg{border-radius:4px}
.bubble-pill .gbc-msg{border-radius:20px;padding:8px 16px}

.font-sm .gbc-msg{font-size:12px} .font-sm #gbc-input{font-size:12px}
.font-md .gbc-msg{font-size:13px} .font-md #gbc-input{font-size:13px}
.font-lg .gbc-msg{font-size:15px} .font-lg #gbc-input{font-size:15px}

#gbc-input-area{padding:12px 16px;display:flex;gap:8px;flex-shrink:0}
#gbc-input{flex:1;height:40px;padding:0 14px;border-radius:20px;outline:none}
#gbc-send{width:40px;height:40px;border:none;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gbc-send:disabled{opacity:.5;cursor:not-allowed}
#gbc-send svg{width:18px;height:18px;fill:#fff}

.gbc-typing{display:flex;gap:4px;padding:10px 14px;align-self:flex-start}
.gbc-typing span{width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:gbcBounce .6s infinite alternate}
.gbc-typing span:nth-child(2){animation-delay:.2s}
.gbc-typing span:nth-child(3){animation-delay:.4s}
@keyframes gbcBounce{to{transform:translateY(-4px);opacity:.4}}

#gbc-powered{text-align:center;padding:6px;font-size:10px;flex-shrink:0}
#gbc-powered a{text-decoration:none}
</style>
</head>
<body>

<button id="gbc-toggle" onclick="toggleChat()">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
</button>

<div id="gbc-window">
  <div id="gbc-header">
    <img id="gbc-header-logo" src="" alt="" style="display:none">
    <div id="gbc-header-info">
      <div id="gbc-header-title">Chat with us</div>
      <div id="gbc-header-subtitle" style="display:none"></div>
    </div>
    <div id="gbc-header-right">
      <div id="gbc-user-avatar" onclick="toggleUserMenu()">
        <div id="gbc-user-menu">
          <div id="gbc-user-menu-name"></div>
          <button onclick="doLogout()">Logout</button>
        </div>
      </div>
      <button id="gbc-close" onclick="toggleChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div id="gbc-login">
    <h3>Sign in to chat</h3>
    <p>Enter your credentials to start chatting</p>
    <div id="gbc-login-error"></div>
    <input id="gbc-email" type="email" placeholder="Email address">
    <input id="gbc-password" type="password" placeholder="Password">
    <button id="gbc-login-btn" onclick="doLogin()">Sign In</button>
  </div>

  <div id="gbc-chat">
    <div id="gbc-messages"></div>
    <div id="gbc-input-area">
      <input id="gbc-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button id="gbc-send" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="gbc-powered">Powered by <a href="#">Genia</a> GenCode</div>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var API_BASE = window.location.origin;
var WIDGET_ID = params.get('widgetId');
var PARENT_ORIGIN = params.get('parentOrigin') || '';
var config = {}, token = localStorage.getItem('gbc_token_'+WIDGET_ID);
var sessionId = localStorage.getItem('gbc_session_'+WIDGET_ID);
var userName = localStorage.getItem('gbc_user_'+WIDGET_ID);
var isOpen = false, isLoading = false;
var isPublicMode = false;
var publicSession = JSON.parse(localStorage.getItem('gbc_public_'+WIDGET_ID)||'null');
var MODE = params.get('mode') || '';
var HOST_WINDOW_MODE = MODE === 'window';
var CONFIG_BRIDGE_MODE = MODE === 'config';

function notifySize(open) {
  parent.postMessage({type:'gbc-resize',open:open,width:open?'380px':'56px',height:open?'520px':'56px'},'*');
}

function notifyStyle() {
  var theme = config.theme || 'light';
  var bg = '#ffffff';
  if(theme === 'dark') bg = '#1e1e2e';
  if(theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) bg = '#1e1e2e';
  if(HOST_WINDOW_MODE) {
    document.documentElement.style.setProperty('background', bg, 'important');
    document.body.style.setProperty('background', bg, 'important');
  }
  parent.postMessage({type:'gbc-style',background:bg},'*');
}

(async function(){
  if(HOST_WINDOW_MODE) document.body.classList.add('host-window');
  if(CONFIG_BRIDGE_MODE) document.body.classList.add('config-bridge');
  if(!CONFIG_BRIDGE_MODE) notifySize(HOST_WINDOW_MODE);
  try {
    var configUrl = API_BASE+'/api/embed/config/'+WIDGET_ID;
    if(PARENT_ORIGIN) configUrl += '?parentOrigin=' + encodeURIComponent(PARENT_ORIGIN);
    var r = await fetch(configUrl);
    if(!r.ok) return;
    config = await r.json();
    if(CONFIG_BRIDGE_MODE) {
      parent.postMessage({type:'gbc-config',widgetId:WIDGET_ID,config:config},'*');
      return;
    }
    applyConfig();
    isPublicMode = config.accessMode === 'public';
    if(isPublicMode) {
      if(!publicSession) { publicSession = { sessionId: null, messageCount: 0 }; }
      sessionId = publicSession.sessionId;
      showPublicChat();
    } else if(token && userName) { showChat(); }
  } catch(e){
    if(CONFIG_BRIDGE_MODE) parent.postMessage({type:'gbc-config-error',widgetId:WIDGET_ID,message:e.message},'*');
  }
})();

function applyConfig(){
  var classes = [
    'theme-'+(config.theme||'light'),
    'bubble-'+(config.bubbleStyle||'modern'),
    'font-'+(config.fontSize||'md')
  ];
  if(HOST_WINDOW_MODE) classes.push('host-window');
  if(CONFIG_BRIDGE_MODE) classes.push('config-bridge');
  document.body.className=classes.join(' ');
  notifyStyle();
  var toggle=document.getElementById('gbc-toggle');
  toggle.style.background=config.color||'#3B82F6';
  if(config.shape==='rounded') toggle.style.borderRadius='14px';
  else if(config.shape==='square') toggle.style.borderRadius='8px';
  if(config.buttonIconUrl){toggle.innerHTML='<img src="'+API_BASE+config.buttonIconUrl+'" alt="">';toggle.style.background='transparent';toggle.style.boxShadow='none';}
  else if(config.logoUrl) toggle.innerHTML='<img src="'+API_BASE+config.logoUrl+'" alt="">';

  var header=document.getElementById('gbc-header');
  header.style.background=config.headerGradient?'linear-gradient(135deg,'+config.color+','+config.headerGradient+')':(config.color||'#3B82F6');
  document.getElementById('gbc-header-title').textContent=config.headerTitle||'Chat with us';
  var sub=document.getElementById('gbc-header-subtitle');
  if(config.headerSubtitle){sub.textContent=config.headerSubtitle;sub.style.display='block';}
  if(config.logoUrl){var logo=document.getElementById('gbc-header-logo');logo.src=API_BASE+config.logoUrl;logo.style.display='block';}
  if(config.windowRadius) document.getElementById('gbc-window').style.borderRadius=config.windowRadius+'px';
  document.getElementById('gbc-login-btn').style.background=config.color||'#3B82F6';
  document.getElementById('gbc-send').style.background=config.color||'#3B82F6';
  if(config.inputPlaceholder) document.getElementById('gbc-input').placeholder=config.inputPlaceholder;
  if(config.showPoweredBy===false) document.getElementById('gbc-powered').style.display='none';
}

function toggleChat(){
  if(HOST_WINDOW_MODE){
    parent.postMessage({type:'gbc-close',widgetId:WIDGET_ID},'*');
    return;
  }
  isOpen=!isOpen;
  document.getElementById('gbc-window').classList.toggle('open',isOpen);
  notifySize(isOpen);
  if(isOpen&&token) setTimeout(function(){document.getElementById('gbc-input').focus();},100);
}

function toggleUserMenu(){document.getElementById('gbc-user-menu').classList.toggle('show');}
document.addEventListener('click',function(e){
  var a=document.getElementById('gbc-user-avatar');
  if(a&&!a.contains(e.target)) document.getElementById('gbc-user-menu').classList.remove('show');
});

function showChat(){
  document.getElementById('gbc-login').style.display='none';
  document.getElementById('gbc-chat').style.display='flex';
  var avatar=document.getElementById('gbc-user-avatar');
  avatar.style.display='flex';
  var init=(userName||'?').charAt(0).toUpperCase();
  avatar.innerHTML=init+'<div id="gbc-user-menu"><div id="gbc-user-menu-name">'+userName+'</div><button onclick="doLogout()">Logout</button></div>';
  var msgs=document.getElementById('gbc-messages');
  if(msgs.children.length===0&&config.welcomeMessage) addMessage('bot',config.welcomeMessage,'welcome');
  if(sessionId) loadHistory();
}

function showPublicChat(){
  document.getElementById('gbc-login').style.display='none';
  document.getElementById('gbc-chat').style.display='flex';
  document.getElementById('gbc-user-avatar').style.display='none';
  var msgs=document.getElementById('gbc-messages');
  if(msgs.children.length===0&&config.welcomeMessage) addMessage('bot',config.welcomeMessage,'welcome');
  if(sessionId) loadPublicHistory().then(function(){
    // Check if limit already reached by counting user messages
    var userMsgs=document.querySelectorAll('.gbc-msg.user').length;
    if(userMsgs>=(config.publicChatLimit||5)){
      document.getElementById('gbc-input').disabled=true;
      document.getElementById('gbc-send').disabled=true;
      document.getElementById('gbc-input').placeholder='Chat limit reached';
    }
  });
}

async function doLogin(){
  var email=document.getElementById('gbc-email').value.trim();
  var pw=document.getElementById('gbc-password').value;
  var err=document.getElementById('gbc-login-error');
  if(!email||!pw){err.textContent='Please fill in all fields';err.style.display='block';return;}
  var btn=document.getElementById('gbc-login-btn');
  btn.disabled=true;btn.textContent='Signing in...';
  try{
    var r=await fetch(API_BASE+'/api/embed/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw,widgetId:WIDGET_ID})});
    var data=await r.json();
    if(!r.ok) throw new Error(data.error||'Login failed');
    token=data.token;userName=data.user.fullName||data.user.email;
    localStorage.setItem('gbc_token_'+WIDGET_ID,token);
    localStorage.setItem('gbc_user_'+WIDGET_ID,userName);
    err.style.display='none';showChat();
  }catch(e){err.textContent=e.message;err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Sign In';}
}

function doLogout(){
  token=null;sessionId=null;userName=null;
  localStorage.removeItem('gbc_token_'+WIDGET_ID);
  localStorage.removeItem('gbc_session_'+WIDGET_ID);
  localStorage.removeItem('gbc_user_'+WIDGET_ID);
  document.getElementById('gbc-messages').innerHTML='';
  document.getElementById('gbc-login').style.display='flex';
  document.getElementById('gbc-chat').style.display='none';
  document.getElementById('gbc-user-avatar').style.display='none';
  document.getElementById('gbc-email').value='';
  document.getElementById('gbc-password').value='';
}

function renderMarkdown(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code style="background:rgba(0,0,0,.08);padding:1px 4px;border-radius:3px;font-size:.9em">$1</code>')
    .replace(/^### (.+)$/gm,'<div style="font-weight:600;margin:6px 0 2px">$1</div>')
    .replace(/^## (.+)$/gm,'<div style="font-weight:600;font-size:1.05em;margin:6px 0 2px">$1</div>')
    .replace(/^# (.+)$/gm,'<div style="font-weight:700;font-size:1.1em;margin:6px 0 2px">$1</div>')
    .replace(/^[-*] (.+)$/gm,'<div style="padding-left:12px">• $1</div>')
    .replace(/^(\d+)\. (.+)$/gm,'<div style="padding-left:12px">$1. $2</div>')
    .replace(/\n/g,'<br>');
}

function addMessage(role,text,cls){
  var msgs=document.getElementById('gbc-messages');
  var div=document.createElement('div');
  div.className='gbc-msg '+(cls||role);
  if(role==='user'){div.style.background=config.color||'#3B82F6';div.textContent=text;}
  else div.innerHTML=renderMarkdown(text);
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  return div;
}

function showTyping(){var m=document.getElementById('gbc-messages');var d=document.createElement('div');d.className='gbc-typing';d.id='gbc-typing';d.innerHTML='<span></span><span></span><span></span>';m.appendChild(d);m.scrollTop=m.scrollHeight;}
function hideTyping(){var e=document.getElementById('gbc-typing');if(e)e.remove();}
function scrollToMessageStart(el){
  var m=document.getElementById('gbc-messages');
  var target=el.offsetTop-12;
  if(target<0) target=0;
  m.scrollTop=target;
}
function setBotMessage(el,text,followBottom){
  el.innerHTML=renderMarkdown(text||'');
  var m=document.getElementById('gbc-messages');
  if(followBottom) m.scrollTop=m.scrollHeight;
}

function createTypewriter(el){
  var state={el:el,visible:'',pending:'',timer:null,started:false};
  state.timer=setInterval(function(){
    if(!state.pending) return;
    var take=state.pending.length>220?7:state.pending.length>120?5:state.pending.length>45?3:1;
    state.visible+=state.pending.slice(0,take);
    state.pending=state.pending.slice(take);
    setBotMessage(state.el,state.visible,true);
    if(!state.started) state.started=true;
  },24);
  return state;
}
function queueTypewriter(state,text){if(text)state.pending+=text;}
function finishTypewriter(state,finalText){
  if(state.timer) clearInterval(state.timer);
  state.timer=null;
  if(finalText!==undefined&&finalText!==null) state.visible=finalText;
  else state.visible+=state.pending;
  state.pending='';
  setBotMessage(state.el,state.visible,true);
}
function drainTypewriter(state,finalText){
  return new Promise(function(resolve){
    function check(){
      if(!state.pending){
        finishTypewriter(state,finalText!==undefined&&finalText!==null?finalText:state.visible);
        resolve();
        return;
      }
      setTimeout(check,30);
    }
    check();
  });
}

async function readSseResponse(res,handlers){
  var reader=res.body.getReader();
  var decoder=new TextDecoder();
  var buffer='';
  function processBlock(block){
    if(!block.trim()||block.trim().charAt(0)===':') return;
    var event='message',data='';
    block.split(/\r?\n/).forEach(function(line){
      if(line.indexOf('event:')===0) event=line.slice(6).trim();
      if(line.indexOf('data:')===0) data+=line.slice(5).trim();
    });
    if(!data) return;
    var parsed;
    try{
      parsed=JSON.parse(data);
    }catch(e){}
    if(parsed&&handlers[event]) handlers[event](parsed);
  }
  while(true){
    var part=await reader.read();
    if(part.done) break;
    buffer+=decoder.decode(part.value,{stream:true});
    var idx;
    while((idx=buffer.indexOf('\n\n'))!==-1){
      processBlock(buffer.slice(0,idx));
      buffer=buffer.slice(idx+2);
    }
  }
  if(buffer.trim()) processBlock(buffer);
}

async function sendMsg(){
  var input=document.getElementById('gbc-input');
  var text=input.value.trim();
  if(!text||isLoading) return;
  input.value='';addMessage('user',text);
  isLoading=true;document.getElementById('gbc-send').disabled=true;showTyping();
  try{
    var r,data,botEl,writer;
    if(isPublicMode){
      r=await fetch(API_BASE+'/api/embed/public/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,sessionId:sessionId,widgetId:WIDGET_ID})});
      if(!r.ok||!r.headers.get('content-type')?.includes('text/event-stream')){
        data=await r.json();if(!r.ok) throw new Error(data.error||'Failed');
        if(!sessionId){sessionId=data.sessionId;publicSession.sessionId=sessionId;localStorage.setItem('gbc_public_'+WIDGET_ID,JSON.stringify(publicSession));}
        hideTyping();addMessage('bot',data.response);
      }else{
        var publicTokenSeen=false;
        var ensurePublicWriter=function(){
          if(writer) return;
          hideTyping();
          botEl=addMessage('bot','');
          writer=createTypewriter(botEl);
        };
        await readSseResponse(r,{
          token:function(d){ensurePublicWriter();publicTokenSeen=true;queueTypewriter(writer,d.token);},
          replace:function(d){ensurePublicWriter();finishTypewriter(writer,d.content||'');writer=createTypewriter(botEl);},
          done:function(d){data=d;ensurePublicWriter();if(!publicTokenSeen&&d.response)queueTypewriter(writer,d.response);},
          error:function(d){throw new Error(d.error||'Failed');}
        });
        if(writer) await drainTypewriter(writer,data&&data.response);
        else hideTyping();
      }
      if(!sessionId){sessionId=data.sessionId;publicSession.sessionId=sessionId;localStorage.setItem('gbc_public_'+WIDGET_ID,JSON.stringify(publicSession));}
      if(data.limitReached||data.remaining<=0){
        document.getElementById('gbc-input').disabled=true;
        document.getElementById('gbc-send').disabled=true;
        document.getElementById('gbc-input').placeholder='Chat limit reached';
      }
    } else {
      r=await fetch(API_BASE+'/api/embed/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:text,sessionId:sessionId,widgetId:WIDGET_ID})});
      if(r.status===401){doLogout();return;}
      if(!r.ok||!r.headers.get('content-type')?.includes('text/event-stream')){
        data=await r.json();if(!r.ok) throw new Error(data.error||'Failed');
        hideTyping();addMessage('bot',data.response);
      }else{
        var privateTokenSeen=false;
        var ensurePrivateWriter=function(){
          if(writer) return;
          hideTyping();
          botEl=addMessage('bot','');
          writer=createTypewriter(botEl);
        };
        await readSseResponse(r,{
          token:function(d){ensurePrivateWriter();privateTokenSeen=true;queueTypewriter(writer,d.token);},
          replace:function(d){ensurePrivateWriter();finishTypewriter(writer,d.content||'');writer=createTypewriter(botEl);},
          done:function(d){data=d;ensurePrivateWriter();if(!privateTokenSeen&&d.response)queueTypewriter(writer,d.response);},
          error:function(d){throw new Error(d.error||'Failed');}
        });
        if(writer) await drainTypewriter(writer,data&&data.response);
        else hideTyping();
      }
      if(!sessionId){sessionId=data.sessionId;localStorage.setItem('gbc_session_'+WIDGET_ID,sessionId);}
    }
  }catch(e){hideTyping();addMessage('bot','Error: '+e.message);}
  finally{isLoading=false;if(!document.getElementById('gbc-input').disabled)document.getElementById('gbc-send').disabled=false;input.focus();}
}

async function loadPublicHistory(){
  if(!sessionId) return;
  try{
    var r=await fetch(API_BASE+'/api/embed/public/messages?sessionId='+sessionId+'&widgetId='+WIDGET_ID);
    if(!r.ok) return;var msgs=await r.json();
    document.getElementById('gbc-messages').innerHTML='';
    if(msgs.length===0&&config.welcomeMessage) addMessage('bot',config.welcomeMessage,'welcome');
    msgs.forEach(function(m){addMessage(m.role==='bot'?'bot':'user',m.content);});
  }catch(e){}
}

async function loadHistory(){
  if(!sessionId||!token) return;
  try{
    var r=await fetch(API_BASE+'/api/embed/messages?sessionId='+sessionId,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok) return;var msgs=await r.json();
    document.getElementById('gbc-messages').innerHTML='';
    if(msgs.length===0&&config.welcomeMessage) addMessage('bot',config.welcomeMessage,'welcome');
    msgs.forEach(function(m){addMessage(m.role==='bot'?'bot':'user',m.content);});
  }catch(e){}
}
