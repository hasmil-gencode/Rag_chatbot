services:
  # ── Main App ──────────────────────────────────
  rag-chatbot:
    build: .
    ports:
      - "1223:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ragchatbot
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./uploads:/app/uploads
      - ./public/logos:/app/public/logos
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ragnet
    restart: unless-stopped

  # ── MongoDB Local ─────────────────────────────
  mongodb:
    image: mongo:7
    # No ports exposed — internal only
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragnet
    restart: unless-stopped

  # ── n8n Local ─────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    # No ports exposed — access via SSH tunnel: ssh -L 5678:localhost:5678 user@server
    environment:
      - DB_TYPE=default
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin}
      - WEBHOOK_URL=http://n8n:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ragnet
    restart: unless-stopped

  # ── Qdrant Vector DB ──────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    # No ports exposed — internal only
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ragnet
    restart: unless-stopped

  # ── Ollama (Embedding models) ──────────────────
  ollama:
    image: ollama/ollama:latest
    # No ports exposed — internal only
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ragnet
    restart: unless-stopped

networks:
  ragnet:
    name: ragnet
    driver: bridge

volumes:
  mongodb_data:
  n8n_data:
  qdrant_data:
  ollama_data:
